name: Switch-Vulkan

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: switch-vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NVK Vulkan (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pre-build the builder image and load it as devkitpro-mesa-rust:latest so
      # build-switch.sh's `docker image inspect` check hits and skips rebuilding.
      # Layers are cached through the GitHub Actions cache.
      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker.rust
          tags: devkitpro-mesa-rust:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Mesa NVK Vulkan for Switch
        run: ./build-switch.sh

      - name: Collect and package artifacts
        run: |
          set -euo pipefail

          ref_name="${GITHUB_REF_NAME//\//-}"
          package_dir="out/package"
          mkdir -p "${package_dir}"

          libraries=(
            src/nouveau/vulkan/libnvk.a
            src/nouveau/vulkan/libvulkan.a
            src/vulkan/util/libvulkan_util.a
            src/compiler/nir/libnir.a
            src/compiler/libcompiler.a
            src/compiler/spirv/libvtn.a
            src/util/libxmlconfig.a
            src/nouveau/compiler/libnak.a
            src/nouveau/compiler/libnak_rs.a
            src/nouveau/nil/libnil.a
            src/nouveau/nil/liblibnil_format_table.a
            src/nouveau/mme/libnouveau_mme.a
            src/nouveau/winsys/libnouveau_ws.a
            src/nouveau/headers/libnvidia_headers_c.a
            src/compiler/rust/libcompiler_c_helpers.a
            src/util/libmesa_util.a
            src/util/libmesa_util_simd.a
            src/util/blake3/libblake3.a
            src/c11/impl/libmesa_util_c11.a
          )

          for lib in "${libraries[@]}"; do
            src="builddir-switch/${lib}"
            if [[ ! -f "${src}" ]]; then
              echo "ERROR: expected archive missing: ${src}" >&2
              exit 1
            fi
            mkdir -p "${package_dir}/$(dirname "${lib}")"
            cp "${src}" "${package_dir}/${lib}"
          done

          mkdir -p "${package_dir}/include"
          cp -R include/vulkan "${package_dir}/include/"
          cp -R include/vk_video "${package_dir}/include/"

          tar -czf "out/mesa-switch-vulkan-${ref_name}.tar.gz" -C "${package_dir}" .

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-switch-vulkan-${{ github.ref_name }}
          path: |
            out/mesa-switch-vulkan-*.tar.gz
            builddir-switch/meson-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/mesa-switch-vulkan-*.tar.gz
          generate_release_notes: true
